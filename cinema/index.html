<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinosaal Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      flex-direction: column;
    }

    .container {
      background: rgba(0, 0, 0, 0.6);
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      max-width: 500px;
      width: 90%;
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 30px;
      color: #ffd700;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
    }

    .message {
      font-size: 1.5em;
      margin: 10px 0;
      padding: 5px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
    }

    .message:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cinema Status</h1>
    <div class="message">Derzeit läuft kein Film.</div>
    <div class="message">No movie is playing right now.</div>
    <div class="message">Aucun film n'est en cours.</div>
    <div class="message">Actualmente no se está reproduciendo ninguna película.</div>
    <div class="message">Attualmente non viene proiettato alcun film.</div>
    <div class="message">現在、上映中の映画はありません。</div>
    <div class="message">目前没有电影播放。</div>
    <div class="message">Сейчас фильм не идёт.</div>
    <div class="message">Filmen spelas inte just nu.</div>
    <div class="message">현재 상영 중인 영화가 없습니다.</div>
  </div>
</body>
</html>
