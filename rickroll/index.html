<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>YOUR FREE STUFF IS GENERATING...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #text {
      font-size: 2em;
      margin-bottom: 30px;
    }

    #startBtn {
      padding: 15px 30px;
      font-size: 1.5em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      display: none; /* Erst nach 5 Sekunden sichtbar */
      transition: 0.3s;
    }

    #startBtn:hover {
      background-color: #2980b9;
    }

    video {
      display: none;       /* Erst nach Klick sichtbar */
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: cover;   /* Füllt den Bereich, bleibt aber responsive */
      pointer-events: none; /* Video nicht klickbar */
    }
  </style>
</head>
<body>
  <div id="text">YOUR FREE STUFF IS GENERATING</div>
  <button id="startBtn">1234</button>
  <video id="video" loop playsinline>
    <source src="rickroll.mp4" type="video/mp4">
    Your Browser doesn't support FREE STUFF
  </video>

  <script>
    const textDiv = document.getElementById('text');
    const btn = document.getElementById('startBtn');
    const video = document.getElementById('video');

    // Prüfen, ob Browser HTML5-Video unterstützt
    if (!video.canPlayType) {
      window.location.href = "https://www.youtube.com/watch?v=xvFZjo5PgG0&list=RDxvFZjo5PgG0&start_radio=1";
    } else {
      // 5 Sekunden warten
      setTimeout(() => {
        textDiv.textContent = "CLICK DOWN HERE TO REDEEM YOUR STUFF!";
        btn.style.display = 'inline-block';
      }, 5000);

      // Klick-Event um Video mit Ton zu starten
      btn.addEventListener('click', () => {
        btn.style.display = 'none';
        textDiv.textContent = "GET RICKROLLED IN 2026";
        video.style.display = 'block';
        video.muted = false; // Ton einschalten
        video.play().catch(() => {
          // Wenn Autoplay mit Ton blockiert wird → YouTube
          window.location.href = "https://www.youtube.com/watch?v=xvFZjo5PgG0&list=RDxvFZjo5PgG0&start_radio=1";
        });

        // Fehlerbehandlung falls Video nicht geladen werden kann
        video.addEventListener('error', () => {
          window.location.href = "https://www.youtube.com/watch?v=xvFZjo5PgG0&list=RDxvFZjo5PgG0&start_radio=1";
        });
      });
    }
  </script>
</body>
</html>
