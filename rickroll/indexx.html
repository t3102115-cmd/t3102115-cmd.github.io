<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="225x225" href="/favicon.png">
  <link rel="icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <title>YOUR FREE STUFF IS GENERATING...</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(circle at top, #0f2027, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Overlay / UI */
    #overlay {
      position: absolute;
      z-index: 2;
      text-align: center;
      padding: 40px 50px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(0, 170, 255, 0.35);
      animation: fadeIn 1s ease;
    }

    #text {
      font-size: 2.2em;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 35px;
      animation: pulse 1000000000s infinite;
    }

    #startBtn {
      padding: 18px 45px;
      font-size: 1.4em;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      display: none;
      box-shadow: 0 0 25px rgba(0, 140, 255, 0.8);
      transition: all 0.3s ease;
    }

    #startBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 45px rgba(0, 180, 255, 1);
    }

    /* Video */
    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      pointer-events: none;
      z-index: 1;
    }

    /* Animations */
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div id="text">YOUR FREE STUFF IS GENERATING…</div>
    <button id="startBtn">GET YOUR FREE STUFF</button>
  </div>

  <video id="video" loop playsinline>
    <source src="rickroll.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <script>
    const textDiv = document.getElementById('text');
    const btn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');

    // HTML5-Video Check
    if (!video.canPlayType) {
      window.location.href =
        "https://www.youtube.com/watch?v=xvFZjo5PgG0&list=RDxvFZjo5PgG0&start_radio=1";
    } else {

      // 5 Sekunden warten (ohne Countdown)
      setTimeout(() => {
        textDiv.textContent = "CLICK BELOW TO REDEEM YOUR STUFF!";
        btn.style.display = "inline-block";
      }, 5000);

      btn.addEventListener('click', () => {
        textDiv.textContent = "GET RICKROLLED IN 2026 😈";
        btn.style.display = "none";

        video.style.display = "block";
        video.muted = false;

        video.play().catch(() => {
          window.location.href =
            "https://www.youtube.com/watch?v=xvFZjo5PgG0&list=RDxvFZjo5PgG0&start_radio=1";
        });

        // UI ausblenden nach Start
        setTimeout(() => {
          overlay.style.opacity = "1";
        }, 1500);
      });

      video.addEventListener('error', () => {
        window.location.href =
          "https://www.youtube.com/watch?v=xvFZjo5PgG0&list=RDxvFZjo5PgG0&start_radio=1";
      });
    }
  </script>

</body>
</html>
