<!DOCTYPE html>
<html lang="en">
<head>
 <link rel="apple-touch-icon" href="/favicon.png">
 <link rel="icon" type="image/png" sizes="225x225" href="/favicon.png">
 <link rel="icon" href="/favicon.ico">
<meta charset="UTF-8">
<title>Silvan's Plugin Hub</title>
<style>
/* Grundlayout */
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
  overflow-y: scroll;
}

/* Schöne Scrollbar */
body::-webkit-scrollbar {
  width: 10px;
}
body::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}
body::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.3);
  border-radius: 10px;
}
body::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.5);
}

/* Header */
header {
  padding: 40px;
  text-align: center;
}

header h1 {
  font-size: 3em;
  margin-bottom: 10px;
}

header p {
  opacity: 0.8;
}

/* Plugin Grid */
#plugins {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
  padding: 40px;
}

/* Plugin-Karten */
.plugin {
  background: rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  transition: 0.3s;
}

.plugin:hover {
  transform: translateY(-6px);
}

.plugin h2 {
  margin-top: 0;
}

.plugin p {
  opacity: 0.85;
}

/* Version Selector & Button */
select, button {
  margin-top: 15px;
  padding: 12px;
  width: 100%;
  border-radius: 12px;
  border: none;
  font-size: 1em;
}

select {
  background: #fff;
  color: #000;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}
select:hover {
  background: #f0f0f0;
}

button {
  background: #00c6ff;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background: #00a8e0;
}

/* README */
.readme {
  margin-top: 15px;
  background: rgba(0,0,0,0.3);
  padding: 12px;
  border-radius: 10px;
  max-height: 180px;
  overflow: auto;
  font-size: 0.9em;
  white-space: pre-wrap;
}

/* Werbung Overlay */
#adOverlay {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 2em;
  z-index: 9999;
  flex-direction: column;
  text-align: center;
  display: none;
}

/* Mobile Support */
@media(max-width: 600px){
  #plugins {
    padding: 20px;
    gap: 15px;
  }
  header h1 { font-size: 2em; }
  select, button { font-size: 0.9em; padding: 10px; }
}
</style>
</head>
<body>

<header>
  <h1>Silvan's Minecraft Plugin Hub</h1>
  <p>Download plugins for your server made by Silvan</p>
</header>

<div id="plugins"></div>

<!-- Werbe-Overlay -->
<div id="adOverlay">
  <div>Ad is playing…<br>Redirecting in <span id="adCountdown">5</span> seconds</div>
</div>

<script>
// Plugins direkt im JS
const plugins = [
  {
    name: "RestartPlus",
    id: "restartplus",
    description: "A Paper plugin that allows admins to restart and stop the server with a reason and delay",
    files: ["RestartPlus-1.0-1.21.10.jar"]
  },
  {
    name: "SpeedrunPlugin",
    id: "speedrunplugin",
    description: "A Minecraft Server paper plugin that allows players to create worlds to speedrun the game",
    files: [
      "Speedrun-Mod-1.0-1.21.10-Release.jar",
      "Speedrun-Mod-1.1-1.21.10-Added-Linking.jar",
      "Speedrun-Mod-1.2-1.21.10-Bug-Fixes.jar",
      "Speedrun-Mod-1.3-1.21.10-More-Bug-Fixes.jar"
    ]
  }
];

const container = document.getElementById("plugins");

plugins.forEach(p => {
  const div = document.createElement("div");
  div.className = "plugin";

  // Sortiere Dateien nach Minecraft-Version für schöneres Dropdown
  const sortedFiles = p.files.slice().sort((a,b)=>{
    const vA = a.match(/\d+\.\d+\.\d+/)?.[0]||"0.0.0";
    const vB = b.match(/\d+\.\d+\.\d+/)?.[0]||"0.0.0";
    return vB.localeCompare(vA);
  });

  const options = sortedFiles.map(f => `<option value="${f}">${f}</option>`).join("");

  div.innerHTML = `
    <h2>${p.name}</h2>
    <p>${p.description}</p>

    <select id="v-${p.id}">
      ${options}
    </select>

    <button onclick="startDownload('${p.id}')">Download</button>

    <div class="readme" id="r-${p.id}">Loading README…</div>
  `;

  container.appendChild(div);

  // README laden
  loadReadme(p.id);
});

// README Funktion
function loadReadme(id) {
  fetch(`${id}/README.md`).then(res=>{
    if(!res.ok) throw new Error("No README");
    return res.text();
  }).then(text=>{
    document.getElementById("r-" + id).textContent = text;
  }).catch(()=>{
    document.getElementById("r-" + id).textContent = "No README available.";
  });
}

// Werbung 5 Sekunden vor Download
function startDownload(id){
  const fileName = document.getElementById("v-"+id).value;
  const overlay = document.getElementById("adOverlay");
  const countdown = document.getElementById("adCountdown");
  overlay.style.display="flex";

  let seconds = 5;
  countdown.textContent = seconds;

  const interval = setInterval(()=>{
    seconds--;
    countdown.textContent = seconds;
    if(seconds <= 0){
      clearInterval(interval);
      window.location.href = `${id}/${fileName}`;
    }
  }, 1000);
}
</script>

</body>
</html>
