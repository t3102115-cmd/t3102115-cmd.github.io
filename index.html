<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Silvan's Website</title>
  <style>
    /* Grundlayout */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      color: #333;
      overflow-x: hidden;
    }

    h1 {
      font-size: 3.5em;
      margin-bottom: 10px;
      color: #1b2a49;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.1);
      animation: fadeInDown 1s ease forwards;
      opacity: 0;
    }

    p {
      font-size: 1.3em;
      margin-bottom: 50px;
      color: #2c3e50;
      animation: fadeInDown 1.2s ease forwards;
      opacity: 0;
    }

    /* Menü-Container */
    #menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    /* Karten-Style für jeden Button */
    #menu li {
      flex: 1 1 200px;
      max-width: 220px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s ease forwards;
    }

    #menu a {
      display: block;
      text-align: center;
      padding: 25px;
      background: linear-gradient(145deg, #3498db, #5dade2);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.2em;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      transition: all 0.4s ease;
    }

    #menu a:hover {
      background: linear-gradient(145deg, #2980b9, #3498db);
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 15px 25px rgba(0,0,0,0.3);
    }

    /* Footer optional */
    footer {
      margin-top: 60px;
      font-size: 0.9em;
      color: #1b2a49;
      opacity: 0;
      animation: fadeInUp 1.5s ease forwards;
    }

    /* Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Staggered animation for menu items */
    #menu li:nth-child(1) { animation-delay: 1.5s; }
    #menu li:nth-child(2) { animation-delay: 1.7s; }
    #menu li:nth-child(3) { animation-delay: 1.9s; }
    #menu li:nth-child(4) { animation-delay: 2.1s; }

    /* Responsive */
    @media(max-width: 600px){
      h1 { font-size: 2.5em; }
      p { font-size: 1.1em; margin-bottom: 30px; }
      #menu li { max-width: 100%; }
    }
  </style>
</head>
<body>
  <h1>Welcome to Silvan's Website!</h1>
  <p>Choose a page from the menu:</p>
  
  <ul id="menu">
    <!-- Dynamisches Menü via JavaScript -->
  </ul>

  <footer>
    &copy; 2026 Silvan
  </footer>

  <script>
    // Unterseiten definieren
    const unterseiten = [
      { name: "Cloud", folder: "cloud/" },
      { name: "FREE ROBUX", folder: "rickroll/" },
      { name: "FREE VBUCKS", folder: "rickroll/" },
      { name: "FREE MONEY", folder: "rickroll/" },
    ];

    const menu = document.getElementById("menu");

    unterseiten.forEach((seite, index) => {
      const li = document.createElement("li");
      const link = document.createElement("a");
      link.href = seite.folder; // Link zum Unterordner
      link.textContent = seite.name;
      li.appendChild(link);
      menu.appendChild(li);
    });
  </script>
</body>
</html>
