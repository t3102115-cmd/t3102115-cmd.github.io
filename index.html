<!DOCTYPE html>
<html>
<head>
<title>Pi Cloud</title>
<style>
body { font-family:sans-serif; background:#0f172a; color:white }
.card { background:#111827; padding:20px; border-radius:12px; margin:10px }
button { padding:10px; border-radius:8px }
.online { color:#22c55e }
.offline { color:#ef4444 }
</style>
</head>

<body>
<h1>Silvan's Cloud</h1>

<div class="card">
  <p id="status">Status...</p>
</div>

<div class="card">
  <input type="file" id="file">
  <button onclick="upload()">Upload</button>
</div>

<div class="card" id="admin" style="display:none">
  <h3>Admin Logs</h3>
  <pre id="logs"></pre>
</div>

<script>
const API = "https://dein-projekt.vercel.app/api";
let role = "user";

async function login() {
  const r = await fetch(API+"/auth", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ user:"admin", pass:"admin123" })
  });
  const j = await r.json();
  role = j.role;
  if (role==="admin") document.getElementById("admin").style.display="block";
}

async function status() {
  const r = await fetch(API+"/status");
  const j = await r.json();
  document.getElementById("status").innerHTML =
    "Pi: <b class='"+j.pi+"'>"+j.pi+"</b>";
}

async function upload() {
  const f = document.getElementById("file").files[0];
  const d = new FormData();
  d.append("file", f);
  const r = await fetch(API+"/upload",{method:"POST",body:d});
  alert(r.ok ? "Uploaded" : "Queued");
}

async function logs() {
  const r = await fetch(API+"/admin");
  document.getElementById("logs").innerText = await r.text();
}

login();
status();
setInterval(status, 5000);
setInterval(logs, 5000);
</script>
</body>
</html>
