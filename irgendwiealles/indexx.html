<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Minecraft Spielzeiten</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #1e1e1e;
    color: white;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.card {
    background: #2c2c2c;
    padding: 25px;
    border-radius: 12px;
    width: 600px;
    max-width: 90%;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.player {
    background: #1b1b1b;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
}

.player-info {
    flex-grow: 1;
}

.status {
    font-weight: bold;
    min-width: 120px;
    text-align: right;
}

.ok { color: #6cf26c; }
.wait { color: #ffcc00; }
.past { color: #ff6c6c; }

button {
    background: #6cf26c;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    margin-left: 15px;
    cursor: pointer;
    font-weight: bold;
}
button:disabled {
    background: #777;
    cursor: not-allowed;
}
</style>
</head>
<body>

<div class="card">
    <h2>Minecraft Spielzeiten</h2>
    <div id="players"></div>
</div>

<script>
// NUR DIESE LISTE ÄNDERN
// Format: Name TT.MM.JJJJ HH:MM
const rawList = [
    "Steve 22.01.2026 18:30",
    "Alex 22.01.2026 19:00"
];

// Service Worker registrieren
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}

// Notification Permission
if ("Notification" in window) {
    Notification.requestPermission();
}

const container = document.getElementById("players");

// Status für Benachrichtigungen: nur wenn Button gedrückt
const alertsEnabled = new Set();
const notified10 = new Set();
const notified1 = new Set();
const notifiedNow = new Set();

function render() {
    container.innerHTML = "";
    const now = new Date();

    rawList.forEach(entry => {
        const [name, date, time] = entry.split(" ");
        const [d,m,y] = date.split(".");
        const [h,min] = time.split(":");
        const playTime = new Date(y,m-1,d,h,min);
        const diff = playTime - now;

        let statusText = "";
        let statusClass = "wait";

        if (diff > 0) {
            const minLeft = Math.ceil(diff/60000);
            statusText = `Dran in ${minLeft} min`;
            statusClass = "wait";
        } else if (diff <= 0 && diff > -60*1000) {
            statusText = "Jetzt dran";
            statusClass = "ok";
        } else {
            statusText = "Vorbei";
            statusClass = "past";
        }

        // Benachrichtigungen nur wenn Button aktiviert
        if (alertsEnabled.has(name)) {
            // 10 min vorher
            if (diff <= 10*60*1000 && diff > 9*60*1000 && !notified10.has(name)) {
                sendNotification(name, "in 10 Minuten dran");
                notified10.add(name);
            }
            // 1 min vorher
            if (diff <= 1*60*1000 && diff > 0 && !notified1.has(name)) {
                sendNotification(name, "in 1 Minute dran");
                notified1.add(name);
            }
            // Jetzt dran
            if (diff <= 0 && diff > -60*1000 && !notifiedNow.has(name)) {
                sendNotification(name, "ist jetzt dran");
                notifiedNow.add(name);
            }
        }

        // Player div
        const div = document.createElement("div");
        div.className = "player";

        const info = document.createElement("div");
        info.className = "player-info";
        info.innerHTML = `<strong>${name}</strong><br><small>${date} ${time}</small>`;

        const status = document.createElement("div");
        status.className = `status ${statusClass}`;
        status.textContent = statusText;

        const btn = document.createElement("button");
        btn.textContent = alertsEnabled.has(name) ? "Benachrichtigungen aktiviert" : "10 Minuten benachrichtigen";
        btn.disabled = alertsEnabled.has(name);
        btn.onclick = () => {
            alertsEnabled.add(name);
            btn.textContent = "Benachrichtigungen aktiviert";
            btn.disabled = true;
        };

        div.appendChild(info);
        div.appendChild(status);
        div.appendChild(btn);
        container.appendChild(div);
    });
}

// Alle 1 Sekunde prüfen
render();
setInterval(render, 1000);

function sendNotification(name, text) {
    if ("Notification" in window && Notification.permission === "granted") {
        if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ name, text });
        } else {
            new Notification("Minecraft Erinnerung", { body: `${name} ${text}` });
        }
    }
}
</script>

</body>
</html>
